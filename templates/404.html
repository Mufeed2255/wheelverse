{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <title>404 | WheelVerse</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Material Icons -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet"
    >

    <script>
        tailwind.config = {
            darkMode: "class",

            theme: {
                extend: {
                    colors: {
                        gold: "#f2ca50",
                        ink: "#070604",
                        cream: "#eee6d7",
                        smoke: "#a79e8c",
                        panel: "#14110c",
                        "panel-light": "#211c14"
                    },

                    fontFamily: {
                        orbitron: ["Orbitron", "sans-serif"],
                        poppins: ["Poppins", "sans-serif"]
                    }
                }
            }
        };
    </script>

    <style>

        :root {
            --gold: #f2ca50;
            --ink: #070604;
            --cream: #eee6d7;
            --smoke: #a79e8c;
            --panel: #14110c;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            background: var(--ink);
            color: var(--cream);
            font-family: "Poppins", sans-serif;
        }

        ::selection {
            background: var(--gold);
            color: #211700;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #080705;
        }

        ::-webkit-scrollbar-thumb {
            background: #5a4923;
            border-radius: 20px;
        }

        /* --------------------------------
           BACKGROUND GRID
        -------------------------------- */

        .showroom-grid {
            background-image:
                linear-gradient(
                    rgba(242, 202, 80, .035) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(242, 202, 80, .035) 1px,
                    transparent 1px
                );

            background-size: 40px 40px;
        }

        @media (min-width: 768px) {

            .showroom-grid {
                background-size: 68px 68px;
            }

        }

        /* --------------------------------
           GRAIN EFFECT
        -------------------------------- */

        .grain::after {
            content: "";

            position: absolute;
            inset: 0;

            pointer-events: none;

            opacity: .16;

            mix-blend-mode: soft-light;

            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.42'/%3E%3C/svg%3E");
        }

        /* --------------------------------
           GLASS PANEL
        -------------------------------- */

        .glass {
            background:
                linear-gradient(
                    145deg,
                    rgba(33, 28, 20, .82),
                    rgba(10, 8, 5, .94)
                );

            border: 1px solid rgba(242, 202, 80, .14);

            backdrop-filter: blur(18px);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, .03),
                0 24px 70px rgba(0, 0, 0, .38);
        }

        /* --------------------------------
           GOLD TEXT
        -------------------------------- */

        .gold-text {
            color: var(--gold);

            text-shadow:
                0 0 28px rgba(242, 202, 80, .30);
        }

        /* --------------------------------
           404 NUMBER
        -------------------------------- */

        .error-number {
            font-family: "Orbitron", sans-serif;

            font-size: clamp(
                7rem,
                22vw,
                15rem
            );

            line-height: .78;

            font-weight: 900;

            letter-spacing: -.08em;

            color: var(--gold);

            text-shadow:
                0 0 20px rgba(242, 202, 80, .12),
                0 0 60px rgba(242, 202, 80, .12);

            user-select: none;
        }

        /* --------------------------------
           CORNER DECORATIONS
        -------------------------------- */

        .corner {
            position: absolute;

            width: 9px;
            height: 9px;

            pointer-events: none;
        }

        .corner-tl {
            top: -1px;
            left: -1px;

            border-top: 1px solid rgba(242, 202, 80, .75);
            border-left: 1px solid rgba(242, 202, 80, .75);
        }

        .corner-tr {
            top: -1px;
            right: -1px;

            border-top: 1px solid rgba(242, 202, 80, .75);
            border-right: 1px solid rgba(242, 202, 80, .75);
        }

        .corner-bl {
            bottom: -1px;
            left: -1px;

            border-bottom: 1px solid rgba(242, 202, 80, .75);
            border-left: 1px solid rgba(242, 202, 80, .75);
        }

        .corner-br {
            bottom: -1px;
            right: -1px;

            border-bottom: 1px solid rgba(242, 202, 80, .75);
            border-right: 1px solid rgba(242, 202, 80, .75);
        }

        /* --------------------------------
           GOLD BUTTON
        -------------------------------- */

        .btn-gold {
            position: relative;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            overflow: hidden;

            background: var(--gold);

            color: #261b00;

            font-family: "Orbitron", sans-serif;

            font-size: 10px;

            font-weight: 800;

            letter-spacing: .16em;

            transition:
                transform .28s ease,
                box-shadow .28s ease;
        }

        .btn-gold::before {
            content: "";

            position: absolute;

            top: 0;
            bottom: 0;

            left: -45%;

            width: 30%;

            transform: skewX(-25deg);

            background: rgba(255, 255, 255, .45);

            transition: left .55s ease;
        }

        .btn-gold:hover {
            transform: translateY(-3px);

            box-shadow:
                0 18px 45px rgba(242, 202, 80, .28);
        }

        .btn-gold:hover::before {
            left: 120%;
        }

        /* --------------------------------
           ANIMATIONS
        -------------------------------- */

        @keyframes reveal-up {

            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .reveal-1 {
            animation:
                reveal-up .8s .05s both;
        }

        .reveal-2 {
            animation:
                reveal-up .9s .18s both;
        }

        .reveal-3 {
            animation:
                reveal-up .9s .32s both;
        }

        .reveal-4 {
            animation:
                reveal-up .9s .46s both;
        }

        /* --------------------------------
           GOLD LINE ANIMATION
        -------------------------------- */

        @keyframes line-pulse {

            0%,
            100% {
                opacity: .25;
                transform: scaleX(.7);
            }

            50% {
                opacity: .8;
                transform: scaleX(1);
            }

        }

        .gold-line {
            animation:
                line-pulse 3s ease-in-out infinite;
        }

        /* --------------------------------
           FLOATING GOLD LIGHT
        -------------------------------- */

        @keyframes ambient-glow {

            0%,
            100% {
                transform: translate3d(0, 0, 0);
                opacity: .35;
            }

            50% {
                transform: translate3d(0, -18px, 0);
                opacity: .65;
            }

        }

        .ambient-glow {
            animation:
                ambient-glow 6s ease-in-out infinite;
        }

        /* --------------------------------
           MOBILE
        -------------------------------- */

        @media (max-width: 640px) {

            .error-number {
                font-size: 7.5rem;
            }

        }

        /* --------------------------------
           REDUCED MOTION
        -------------------------------- */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration: .01ms !important;

                animation-iteration-count: 1 !important;

                scroll-behavior: auto !important;

                transition-duration: .01ms !important;

            }

        }

    </style>
</head>


<body>

    <!-- ==========================================
         MAIN 404 PAGE
    =========================================== -->

    <main
        class="grain showroom-grid relative min-h-screen flex items-center justify-center overflow-hidden px-4 py-10 sm:px-6 md:px-10"
    >

        <!-- Ambient Background Glow -->

        <div
            class="ambient-glow pointer-events-none absolute -top-40 left-1/2 h-[500px] w-[500px] -translate-x-1/2 rounded-full bg-gold/5 blur-[120px]"
        ></div>


        <div
            class="pointer-events-none absolute -bottom-40 -left-40 h-[400px] w-[400px] rounded-full bg-gold/5 blur-[120px]"
        ></div>


        <div
            class="pointer-events-none absolute -right-40 top-1/3 h-[400px] w-[400px] rounded-full bg-gold/5 blur-[120px]"
        ></div>


        <!-- ==========================================
             ERROR CARD
        =========================================== -->

        <section
            class="glass relative z-10 w-full max-w-[1050px] overflow-hidden px-6 py-12 sm:px-10 sm:py-14 md:px-16 md:py-16 lg:px-20"
        >

            <!-- Corner Decorations -->

            <span class="corner corner-tl"></span>
            <span class="corner corner-tr"></span>
            <span class="corner corner-bl"></span>
            <span class="corner corner-br"></span>


            <!-- Top Gold Line -->

            <div
                class="gold-line mx-auto mb-8 h-px w-24 bg-gradient-to-r from-transparent via-gold to-transparent sm:mb-10"
            ></div>


            <!-- ==========================================
                 BRAND
            =========================================== -->

            <div
                class="reveal-1 flex items-center justify-center gap-3"
            >

                <span
                    class="h-1.5 w-1.5 rounded-full bg-gold shadow-[0_0_12px_rgba(242,202,80,.8)]"
                ></span>

                <span
                    class="font-orbitron text-[9px] font-semibold tracking-[.35em] text-cream sm:text-[10px] sm:tracking-[.42em]"
                >
                    WHEELVERSE
                </span>

                <span
                    class="font-orbitron text-[9px] font-medium tracking-[.25em] text-gold sm:text-[10px] sm:tracking-[.30em]"
                >
                    ERROR
                </span>

                <span
                    class="h-1.5 w-1.5 rounded-full bg-gold shadow-[0_0_12px_rgba(242,202,80,.8)]"
                ></span>

            </div>


            <!-- ==========================================
                 404 NUMBER
            =========================================== -->

            <div
                class="reveal-2 mt-10 text-center sm:mt-12"
            >

                <div
                    class="error-number"
                    aria-label="404"
                >
                    404
                </div>

            </div>


            <!-- ==========================================
                 TITLE
            =========================================== -->

            <div
                class="reveal-3 mt-5 text-center sm:mt-7"
            >

                <h1
                    class="font-orbitron text-xl font-bold uppercase tracking-[.08em] text-cream sm:text-2xl md:text-3xl"
                >
                    PAGE NOT FOUND
                </h1>


                <div
                    class="mx-auto mt-5 h-px w-28 bg-gradient-to-r from-transparent via-gold/70 to-transparent"
                ></div>

            </div>


            <!-- ==========================================
                 DESCRIPTION
            =========================================== -->

            <div
                class="reveal-3 mx-auto mt-6 max-w-xl text-center"
            >

                <p
                    class="text-xs leading-6 text-smoke sm:text-sm sm:leading-7"
                >
                    Looks like you've taken a wrong turn in the
                    <span class="text-cream">WheelVerse</span>.
                    The page you're looking for doesn't exist,
                    may have been moved, or the URL may be incorrect.
                </p>

            </div>


            <!-- ==========================================
                 ERROR CODE
            =========================================== -->

            <div
                class="reveal-4 mt-7 flex items-center justify-center gap-3"
            >

                <span
                    class="h-px w-8 bg-gold/20 sm:w-12"
                ></span>

                <span
                    class="font-orbitron text-[8px] tracking-[.25em] text-gold/60"
                >
                    ERROR CODE 404
                </span>

                <span
                    class="h-px w-8 bg-gold/20 sm:w-12"
                ></span>

            </div>


            <!-- ==========================================
                 BUTTON
            =========================================== -->

            <div
                class="reveal-4 mt-9 flex justify-center sm:mt-10"
            >

                <a
                    href="{% url 'landing_page' %}"
                    class="btn-gold w-full px-7 py-4 sm:w-auto sm:px-10 sm:py-5"
                >

                    <span>
                        BACK TO HOME
                    </span>

                    <span
                        class="material-symbols-outlined text-base"
                    >
                        arrow_forward
                    </span>

                </a>

            </div>


            <!-- ==========================================
                 BOTTOM BRANDING
            =========================================== -->

            <div
                class="mt-12 flex items-center justify-center gap-3 border-t border-white/5 pt-6 sm:mt-14"
            >

                <span
                    class="font-orbitron text-[7px] tracking-[.30em] text-smoke/60 sm:text-[8px]"
                >
                    ENTER THE UNIVERSE OF WHEELS
                </span>

            </div>

        </section>

    </main>


</body>
</html>
