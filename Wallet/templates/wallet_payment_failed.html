<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wallet Payment Failed</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#080705] text-[#eae1d4] min-h-screen">

{% include "include/user_sidebar.html" %}
{% include "include/user_topbar.html" %}
{% include "adminpanel/includes/messages.html" %}

<main class="min-h-screen flex items-center justify-center px-6" style="margin-left:360px;padding-top:120px;">
    <div class="bg-[#16130b] border border-red-400/30 max-w-xl w-full p-10 text-center rounded-xl">
        <div class="text-red-300 text-7xl mb-5">×</div>

        <h1 class="text-4xl text-red-300 font-bold uppercase">
            Payment Failed
        </h1>

        <p class="text-[#d0c5af] mt-4">
            Your wallet top-up was cancelled or failed.
        </p>

        <p class="text-[#d0c5af] mt-2 text-sm">
            Amount: ₹{{ amount }}
        </p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-8">
            <a href="{% url 'add_money' %}"
               class="bg-[#f2ca50] text-black py-4 rounded font-bold">
                RETRY
            </a>

            <a href="{% url 'wallet' %}"
               class="border border-[#f2ca50]/30 text-[#f2ca50] py-4 rounded font-bold">
                BACK TO WALLET
            </a>
        </div>
    </div>
</main>

</body>
</html>
