<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create New Password | WheelVerse</title>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

<style>
    body {
        background-color: #0A0A0A;
        color: #eae1d4;
        overflow: hidden;
        font-family: Poppins, sans-serif;
    }

    .glass-panel {
        background: rgba(17, 14, 7, 0.75);
        backdrop-filter: blur(22px);
        border: 1px solid rgba(242, 202, 80, 0.18);
        clip-path: polygon(0% 5%, 5% 0%, 95% 0%, 100% 5%, 100% 95%, 95% 100%, 5% 100%, 0% 95%);
        width: 520px;
        animation: fadeUp 0.9s ease forwards;
    }

    .input-glass {
        background: rgba(26, 26, 26, 0.65);
        border-bottom: 2px solid rgba(242, 202, 80, 0.25);
        transition: all 0.3s ease;
    }

    .input-glass:focus {
        border-bottom-color: #f2ca50;
        box-shadow: 0 8px 22px -10px rgba(242, 202, 80, 0.8);
        outline: none;
    }

    .gold-gradient-btn {
        background: linear-gradient(135deg, #f2ca50 0%, #d4af37 50%, #e9c349 100%);
        box-shadow: 0 0 22px rgba(242, 202, 80, 0.35);
    }

    .gold-gradient-btn:hover {
        box-shadow: 0 0 35px rgba(242, 202, 80, 0.65);
        transform: translateY(-2px);
    }

    .carbon-texture {
        background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.05) 1px, transparent 0);
        background-size: 4px 4px;
    }

    .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(40px) scale(0.96);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    .light-streak {
        animation: moveLight 5s linear infinite;
    }

    @keyframes moveLight {
        0% {
            transform: translateX(-100%) rotate(15deg);
        }
        100% {
            transform: translateX(200%) rotate(15deg);
        }
    }
</style>
</head>

<body class="h-screen w-screen relative flex items-center justify-center">

<!-- Background -->
<div class="fixed inset-0 z-[-1]">
    <div class="absolute inset-0 bg-black/60 z-10"></div>

    <img
        class="w-full h-full object-cover"
        src="https://lh3.googleusercontent.com/aida-public/AB6AXuAZtbZpLeuHYAasuVT-RxCm4hDGy0z3I9qSovkzRYtRdnedU9S-u3v_s8jN6WhSR59Y5YRc2OGsX7brHpqN6mnGF7zxdQKcadI7BBrIVqAv7Ut1IyylGV-NbvCKtRNaKOdPZVax1AsO4fzffuqYBRdGfIUhEG9GqYEDfxzc_ndz5uUcYPUOMpRCOKJIZLdBtzW7tAGWjCg4Tea8Lfs-lLV6FnOmZehxp6Dku5SefB5i0_0dUK-UruW0bLQ4F9XoyAsh-DcF0RwiAQ0"
        alt="Luxury Garage Background"
    >

    <div class="absolute inset-0 bg-gradient-to-t from-[#16130b] via-transparent to-transparent opacity-95 z-20"></div>
    <div class="absolute inset-0 bg-gradient-to-r from-[#16130b]/70 via-transparent to-[#16130b]/70 opacity-70 z-20"></div>
</div>

<!-- Animated Streaks -->
<div class="fixed inset-0 pointer-events-none overflow-hidden opacity-30">
    <div class="light-streak absolute top-1/4 left-0 w-[55%] h-[1px] bg-gradient-to-r from-transparent via-[#f2ca50] to-transparent blur-sm"></div>
    <div class="light-streak absolute bottom-1/3 left-0 w-[45%] h-[1px] bg-gradient-to-r from-transparent via-[#f2ca50] to-transparent blur-sm" style="animation-delay: 2s;"></div>
</div>

<main class="relative z-20 flex items-center justify-center">

    <div class="glass-panel p-16 flex flex-col items-center relative overflow-hidden">

        <div class="absolute inset-0 border border-[#f2ca50]/20 pointer-events-none carbon-texture opacity-20"></div>

        <!-- Branding -->
        <div class="flex flex-col items-center mb-10 text-center w-full relative z-10">
            <span class="font-[Orbitron] text-3xl tracking-[0.5em] text-[#e9c349] mb-3 uppercase">
                WheelVerse
            </span>

            <span class="font-[Orbitron] text-[11px] tracking-[0.4em] text-[#f2ca50]/70 mb-8">
                Enter the Universe of Wheels
            </span>

            <h1 class="font-[Orbitron] text-4xl text-[#eae1d4] mb-5">
                Create New Password
            </h1>

            <p class="text-[#d0c5af] max-w-sm leading-relaxed">
                Secure your collector account with a powerful new password.
            </p>
        </div>

        <!-- Messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="w-full mb-5 px-4 py-3 rounded-lg text-sm text-center
                    {% if message.tags == 'error' %}
                        bg-red-500/20 text-red-400 border border-red-500/30
                    {% elif message.tags == 'success' %}
                        bg-green-500/20 text-green-400 border border-green-500/30
                    {% endif %}
                ">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <!-- Form -->
        <form method="POST" action="{% url 'reset_password' %}">
            {% csrf_token %}
            <!-- New Password -->
            <div class="space-y-3 group">
                <label class="font-[Orbitron] text-xs tracking-wider text-[#f2ca50]/70 ml-1">
                    New Password
                </label>

                <div class="relative">
                    <span class="material-symbols-outlined absolute left-5 top-1/2 -translate-y-1/2 text-[#f2ca50]/40 group-focus-within:text-[#f2ca50] transition-colors">
                        lock
                    </span>

                    <input
                        id="password"
                        name="password"
                        class="w-full input-glass py-5 pl-14 pr-14 text-lg text-[#eae1d4] placeholder:text-[#38342b] rounded-t-xl"
                        placeholder="••••••••••••"
                        type="password"
                    >

                    <button
                        type="button"
                        onclick="togglePassword('password', 'eyeIcon1')"
                        class="absolute right-5 top-1/2 -translate-y-1/2 text-[#d0c5af] hover:text-[#f2ca50]"
                    >
                        <span id="eyeIcon1" class="material-symbols-outlined">visibility</span>
                    </button>
                </div>

                <p id="passwordError" class="text-red-400 text-sm mt-2"></p>
            </div>

            <!-- Confirm Password -->
            <div class="space-y-3 group">
                <label class="font-[Orbitron] text-xs tracking-wider text-[#f2ca50]/70 ml-1">
                    Confirm New Password
                </label>

                <div class="relative">
                    <span class="material-symbols-outlined absolute left-5 top-1/2 -translate-y-1/2 text-[#f2ca50]/40 group-focus-within:text-[#f2ca50] transition-colors">
                        verified_user
                    </span>

                    <input
                        id="confirm_password"
                        name="confirm_password"
                        class="w-full input-glass py-5 pl-14 pr-14 text-lg text-[#eae1d4] placeholder:text-[#38342b] rounded-t-xl"
                        placeholder="••••••••••••"
                        type="password"
                    >

                    <button
                        type="button"
                        onclick="togglePassword('confirm_password', 'eyeIcon2')"
                        class="absolute right-5 top-1/2 -translate-y-1/2 text-[#d0c5af] hover:text-[#f2ca50]"
                    >
                        <span id="eyeIcon2" class="material-symbols-outlined">visibility</span>
                    </button>
                </div>

                <p id="confirmPasswordError" class="text-red-400 text-sm mt-2"></p>
            </div>


            <!-- Submit Button -->
            <button
                class="w-full gold-gradient-btn py-5 rounded-lg flex items-center justify-center group transition-all duration-300 active:scale-95 overflow-hidden relative"
                type="submit"
            >
                <div class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity skew-x-[-20deg] scale-150 -translate-x-full group-hover:translate-x-full duration-1000"></div>

                <span class="font-[Orbitron] text-lg font-bold tracking-[0.2em] text-[#3c2f00] flex items-center gap-4 relative z-10">
                    SAVE NEW PASSWORD
                    <span class="material-symbols-outlined text-[#3c2f00] group-hover:translate-x-1 transition-transform">
                        arrow_forward
                    </span>
                </span>
            </button>

        </form>

        <!-- Footer -->
        <div class="mt-10 flex flex-col items-center gap-5 relative z-10">
            <a
                class="font-[Orbitron] text-[11px] tracking-widest text-[#e9c349] hover:text-white transition-colors flex items-center gap-3 uppercase"
                href="{% url 'login' %}"
            >
                <span class="material-symbols-outlined text-sm">arrow_back</span>
                Back to Login
            </a>
        </div>

    </div>

</main>

<script>
function togglePassword(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);

    if (input.type === "password") {
        input.type = "text";
        icon.innerText = "visibility_off";
    } else {
        input.type = "password";
        icon.innerText = "visibility";
    }
}




function validateResetPassword() {
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirm_password").value;

    let passwordError = document.getElementById("passwordError");
    let confirmPasswordError = document.getElementById("confirmPasswordError");

    passwordError.innerText = "";
    confirmPasswordError.innerText = "";

    if (password === "") {
        passwordError.innerText = "Password cannot be empty.";
        return false;
    }

    if (password.length < 8) {
        passwordError.innerText = "Password must be at least 8 characters.";
        return false;
    }

    if (!/[A-Z]/.test(password)) {
        passwordError.innerText = "Password must contain one uppercase letter.";
        return false;
    }

    if (!/[a-z]/.test(password)) {
        passwordError.innerText = "Password must contain one lowercase letter.";
        return false;
    }

    if (!/[0-9]/.test(password)) {
        passwordError.innerText = "Password must contain one number.";
        return false;
    }

    if (!/[!@#$%^&*(),.?":{}|<>]/.test(password)) {
        passwordError.innerText = "Password must contain one special character.";
        return false;
    }

    if (confirmPassword === "") {
        confirmPasswordError.innerText = "Confirm password cannot be empty.";
        return false;
    }

    if (password !== confirmPassword) {
        confirmPasswordError.innerText = "Passwords do not match.";
        return false;
    }

    return true;
}
setTimeout(function () {
    const messageBox = document.getElementById("messageBox");

    if (messageBox) {
        messageBox.style.transition = "all 0.5s ease";
        messageBox.style.opacity = "0";
        messageBox.style.transform = "translateY(-10px)";

        setTimeout(function () {
            messageBox.remove();
        }, 500);
    }
}, 3000);

</script>

</body>
</html>
