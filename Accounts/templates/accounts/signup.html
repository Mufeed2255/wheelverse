<style>
    body { background-color: #0A0A0A; overflow-x: hidden; }
    .carbon-pattern {
      background-image: linear-gradient(45deg, #111 25%, transparent 25%), linear-gradient(-45deg, #111 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #111 75%), linear-gradient(-45deg, transparent 75%, #111 75%);
      background-size: 4px 4px;
      background-color: #0d0d0d;
    }
    .glass-card {
      background: rgba(26, 26, 26, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(242, 202, 80, 0.15);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(242, 202, 80, 0.05);
    }
    .gold-gradient-btn { background: linear-gradient(135deg, #f2ca50 0%, #d4af37 50%, #b8860b 100%); position: relative; overflow: hidden; }
    .gold-gradient-btn::after {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
      transform: rotate(45deg); transition: 0.5s;
    }
    .gold-gradient-btn:hover::after { left: 120%; }
    .input-focus-glow:focus-within { box-shadow: 0 0 10px rgba(242, 202, 80, 0.3); border-color: #f2ca50; }
    .neon-blue-glow { text-shadow: 0 0 8px rgba(59, 130, 246, 0.6); }
    .particle-overlay { background-image: radial-gradient(circle, #f2ca50 1px, transparent 1px); background-size: 80px 80px; opacity: 0.1; }
    .btn-disabled { opacity: 0.6; pointer-events: none; }
    .spinner {
      width: 18px; height: 18px; border: 2px solid rgba(0,0,0,0.3);
      border-top-color: #241a00; border-radius: 50%; display: inline-block;
      animation: spin 0.7s linear infinite; margin-right: 8px; vertical-align: -3px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

<div class="fixed inset-0 z-[-1] overflow-hidden">

<div class="absolute inset-0 bg-gradient-to-t from-background via-background/60 to-transparent"></div>
<div class="absolute inset-0 particle-overlay"></div>
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary/40 to-transparent"></div>
</div>

<main class="min-h-screen flex items-center justify-center px-margin-mobile md:px-margin-desktop py-12">
<div class="glass-card w-full max-w-[600px] rounded-xl p-8 md:p-12 relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-1.5 carbon-pattern opacity-50 border-b border-primary/20"></div>

<div class="text-center mb-10">
<div class="inline-block mb-4">
<span class="font-display-lg text-headline-md tracking-widest text-primary-fixed-dim block">WheelVerse</span>
<span class="font-label-caps text-label-caps text-on-surface-variant tracking-[0.3em] block mt-1 uppercase">Enter the Universe of Wheels</span>
</div>
<h1 class="font-headline-md text-primary mt-4 mb-2">Create Your Collector Account</h1>
<p class="font-body-md text-on-surface-variant/80">Join the premium collector universe</p>
</div>

<!-- General / server-side error or success banner -->
<div id="generalMessage" class="mb-4 px-4 py-3 rounded-lg text-sm font-medium hidden"></div>

<form id="signupForm" method="POST" action="{% url 'signup' %}" class="space-y-5" novalidate>
{% csrf_token %}

<div class="group">
<label class="font-label-caps text-label-caps text-primary/70 mb-2 block ml-1">Username</label>
<div class="relative input-focus-glow transition-all duration-300 rounded-lg border border-outline-variant bg-surface-container-low/50">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">person</span>
<input type="text" name="username" id="username" placeholder="Enter username"
    class="w-full bg-transparent border-none text-on-surface placeholder:text-on-surface-variant/30 py-3.5 pl-12 pr-4 focus:ring-0 rounded-lg">
</div>
<p id="usernameError" class="text-red-400 text-sm mt-2"></p>
</div>

<div class="group">
<label class="font-label-caps text-label-caps text-primary/70 mb-2 block ml-1">Email Address</label>
<div class="relative input-focus-glow transition-all duration-300 rounded-lg border border-outline-variant bg-surface-container-low/50">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">mail</span>
<input type="email" name="email" id="email" placeholder="collector@wheelverse.com"
    class="w-full bg-transparent border-none text-on-surface placeholder:text-on-surface-variant/30 py-3.5 pl-12 pr-4 focus:ring-0 rounded-lg">
</div>
<p id="emailError" class="text-red-400 text-sm mt-2"></p>
</div>

<div class="group">
<label class="font-label-caps text-label-caps text-primary/70 mb-2 block ml-1">Phone Number</label>
<div class="relative input-focus-glow transition-all duration-300 rounded-lg border border-outline-variant bg-surface-container-low/50">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">call</span>
<input type="text" name="phone" id="phone" placeholder="+91 9876543210"
    class="w-full bg-transparent border-none text-on-surface placeholder:text-on-surface-variant/30 py-3.5 pl-12 pr-4 focus:ring-0 rounded-lg">
</div>
<p id="phoneError" class="text-red-400 text-sm mt-2"></p>
</div>

<div class="group">
<label class="font-label-caps text-label-caps text-primary/70 mb-2 block ml-1">Password</label>
<div class="relative input-focus-glow transition-all duration-300 rounded-lg border border-outline-variant bg-surface-container-low/50">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">lock</span>
<input type="password" name="password" id="password" placeholder="••••••••"
    class="w-full bg-transparent border-none text-on-surface placeholder:text-on-surface-variant/30 py-3.5 pl-12 pr-4 focus:ring-0 rounded-lg">
</div>
<p id="passwordError" class="text-red-400 text-sm mt-2"></p>
</div>

<div class="group">
<label class="font-label-caps text-label-caps text-primary/70 mb-2 block ml-1">Confirm Password</label>
<div class="relative input-focus-glow transition-all duration-300 rounded-lg border border-outline-variant bg-surface-container-low/50">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">shield</span>
<input type="password" name="confirm_password" id="confirm_password" placeholder="••••••••"
    class="w-full bg-transparent border-none text-on-surface placeholder:text-on-surface-variant/30 py-3.5 pl-12 pr-4 focus:ring-0 rounded-lg">
</div>
<p id="confirmPasswordError" class="text-red-400 text-sm mt-2"></p>
</div>

<div class="mt-4">
<button type="button" onclick="toggleReferralBox()"
    class="text-primary text-sm font-semibold hover:underline underline-offset-4 flex items-center gap-2">
    Have a referral code?
    <span id="referralArrow" class="material-symbols-outlined text-[18px] transition-transform">expand_more</span>
</button>

<div id="referralBox" class="hidden mt-4">
<label class="font-label-caps text-label-caps text-primary/70 mb-2 block ml-1">Referral Code</label>
<div class="relative input-focus-glow transition-all duration-300 rounded-lg border border-outline-variant bg-surface-container-low/50">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">redeem</span>
<input type="text" name="referral_code" id="referral_code" placeholder="Enter referral code"
    value="{{ referral_code|default:'' }}"
    class="w-full bg-transparent border-none text-on-surface placeholder:text-on-surface-variant/30 py-3.5 pl-12 pr-4 focus:ring-0 rounded-lg uppercase">
</div>
<p id="referral_codeError" class="text-red-400 text-sm mt-2"></p>
</div>
</div>

<button type="submit" id="signupSubmitBtn"
    class="gold-gradient-btn w-full py-5 rounded-xl font-label-caps text-on-primary-container text-lg tracking-widest mt-2">
    <span id="signupSubmitLabel">ENTER WHEELVERSE</span>
</button>
</form>

<div class="w-full flex justify-center mb-8 mt-6">
<a href="{% provider_login_url 'google' %}"
   class="w-full bg-surface-container-high/50 border border-outline-variant/20 py-4 rounded-lg flex items-center justify-center gap-3 hover:bg-surface-container-highest transition-colors active:scale-95 text-center cursor-pointer">
<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>

<span class="font-label-caps text-xs tracking-widest text-on-surface">Continue with Google</span>
</a>
</div>

<div class="text-center">
<p class="font-body-md text-on-surface-variant text-[14px]">
    Already have an account?
    <a class="text-primary font-semibold hover:underline decoration-primary/30 underline-offset-4 transition-all neon-blue-glow" href="{% url 'login' %}">login</a>
</p>
</div>
</div>
</main>

<script>
function toggleReferralBox() {
    const referralBox = document.getElementById("referralBox");
    const referralArrow = document.getElementById("referralArrow");
    referralBox.classList.toggle("hidden");
    referralArrow.classList.toggle("rotate-180");
}

function getCookie(name) {
    const match = document.cookie.match("(^|;)\\s*" + name + "\\s*=\\s*([^;]+)");
    return match ? match.pop() : "";
}

const fieldIds = ["username", "email", "phone", "password", "confirm_password", "referral_code"];

function clearErrors() {
    fieldIds.forEach((f) => {
        const el = document.getElementById(f + "Error");
        if (el) el.innerText = "";
    });
    const general = document.getElementById("generalMessage");
    general.classList.add("hidden");
    general.innerText = "";
}

function showGeneralMessage(text, isError) {
    const general = document.getElementById("generalMessage");
    general.innerText = text;
    general.classList.remove("hidden");
    general.classList.remove("bg-red-500/20", "text-red-400", "border-red-500/30", "bg-green-500/20", "text-green-400", "border-green-500/30");
    if (isError) {
        general.classList.add("bg-red-500/20", "text-red-400", "border", "border-red-500/30");
    } else {
        general.classList.add("bg-green-500/20", "text-green-400", "border", "border-green-500/30");
    }
}

function validateSignupForm() {
    let isValid = true;
    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirm_password").value;

    if (username === "") {
        document.getElementById("usernameError").innerText = "Username cannot be empty.";
        isValid = false;
    } else if (username.length < 5 || username.length > 20) {
        document.getElementById("usernameError").innerText = "Username must be between 5 and 20 characters.";
        isValid = false;
    } else if (!/^[A-Za-z0-9]+$/.test(username)) {
        document.getElementById("usernameError").innerText =
            "Username can contain only letters and numbers without spaces or special characters.";
        isValid = false;
    }
    if (email === "") {
        document.getElementById("emailError").innerText = "Email cannot be empty.";
        isValid = false;
    } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        document.getElementById("emailError").innerText = "Enter a valid email address.";
        isValid = false;
    }

    if (password === "") {
        document.getElementById("passwordError").innerText = "Password cannot be empty.";
        isValid = false;
    } else if (password.length < 8) {
        document.getElementById("passwordError").innerText = "Password must be at least 8 characters.";
        isValid = false;
    } else if (!/[A-Z]/.test(password)) {
        document.getElementById("passwordError").innerText = "Password must contain one uppercase letter.";
        isValid = false;
    } else if (!/[a-z]/.test(password)) {
        document.getElementById("passwordError").innerText = "Password must contain one lowercase letter.";
        isValid = false;
    } else if (!/[0-9]/.test(password)) {
        document.getElementById("passwordError").innerText = "Password must contain one number.";
        isValid = false;
    } else if (!/[!@#$%^&*(),.?":{}|<>]/.test(password)) {
        document.getElementById("passwordError").innerText = "Password must contain one special character.";
        isValid = false;
    }

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (confirmPassword.trim() === "") {
        document.getElementById("confirmPasswordError").innerText =
            "Confirm password cannot be empty.";
        isValid = false;
    } else if (password !== confirmPassword) {
        document.getElementById("confirmPasswordError").innerText =
            "Passwords do not match.";
        isValid = false;
    }

function setSubmitLoading(loading) {
    const btn = document.getElementById("signupSubmitBtn");
    const label = document.getElementById("signupSubmitLabel");
    if (loading) {
        btn.classList.add("btn-disabled");
        label.innerHTML = '<span class="spinner"></span>Creating account...';
    } else {
        btn.classList.remove("btn-disabled");
        label.innerText = "ENTER WHEELVERSE";
    }
}

document.getElementById("signupForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    clearErrors();

    if (!validateSignupForm()) {
        return;
    }

    const form = e.target;
    const formData = new FormData(form);
    setSubmitLoading(true);

    try {
        const response = await fetch(form.action, {
            method: "POST",
            body: formData,
            headers: {
                "X-Requested-With": "XMLHttpRequest",
                "X-CSRFToken": getCookie("csrftoken"),
            },
        });

        const data = await response.json();

        if (response.ok && data.success) {
            showGeneralMessage(data.message || "OTP sent successfully.", false);
            window.location.href = data.redirect_url;
            return;
        }

        // Field-level error from the server.
        if (data.field && data.field !== "general") {
            const errorEl = document.getElementById(data.field + "Error");
            if (errorEl) {
                errorEl.innerText = data.message;
            } else {
                showGeneralMessage(data.message, true);
            }
        } else {
            showGeneralMessage(data.message || "Something went wrong. Please try again.", true);
        }
    } catch (err) {
        showGeneralMessage("Network error. Please check your connection and try again.", true);
    } finally {
        setSubmitLoading(false);
    }
});
</script>
</body>
</html>
