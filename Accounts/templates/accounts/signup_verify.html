<style>

        content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
        background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        transform: rotate(45deg); transition: 0.5s;
    }
    .shine-sweep:hover::after { left: 100%; }
    .otp-input.error-shake { animation: shake 0.3s; border-color: #ffb4ab !important; }
    @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);} }
    .btn-disabled { opacity: 0.6; pointer-events: none; }
    .spinner {
        width: 18px; height: 18px; border: 2px solid rgba(0,0,0,0.3);
        border-top-color: #241a00; border-radius: 50%; display: inline-block;
        animation: spin 0.7s linear infinite; margin-right: 8px; vertical-align: -3px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

<script>
const inputs = document.querySelectorAll(".otp-input");
const hiddenOtp = document.getElementById("otp");
const otpError = document.getElementById("otpError");
const otpForm = document.getElementById("otpForm");
const generalMessage = document.getElementById("generalMessage");
const resendBtn = document.getElementById("resendBtn");
const otpTimer = document.getElementById("otpTimer");
const submitBtn = document.getElementById("otpSubmitBtn");
const submitLabel = document.getElementById("otpSubmitLabel");

function getCookie(name) {
    const match = document.cookie.match("(^|;)\\s*" + name + "\\s*=\\s*([^;]+)");
    return match ? match.pop() : "";
}

function collectOtp() {
    return Array.from(inputs).map((i) => i.value).join("");
}

function clearOtpInputs() {
    inputs.forEach((i) => (i.value = ""));
    hiddenOtp.value = "";
    inputs[0].focus();
}

function shakeInputs() {
    inputs.forEach((i) => {
        i.classList.add("error-shake");
        setTimeout(() => i.classList.remove("error-shake"), 300);
    });
}

function showGeneral(text, isError) {
    generalMessage.innerText = text;
    generalMessage.classList.remove("hidden");
    generalMessage.classList.remove("bg-red-500/20", "text-red-400", "border-red-500/30", "bg-green-500/20", "text-green-400", "border-green-500/30");
    if (isError) {
        generalMessage.classList.add("bg-red-500/20", "text-red-400", "border", "border-red-500/30");
    } else {
        generalMessage.classList.add("bg-green-500/20", "text-green-400", "border", "border-green-500/30");
    }
}

inputs.forEach((input, index) => {
    input.addEventListener("input", () => {
        input.value = input.value.replace(/[^0-9]/g, "");
        if (input.value && index < inputs.length - 1) {
            inputs[index + 1].focus();
        }
        hiddenOtp.value = collectOtp();
        otpError.innerText = "";
    });

    input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !input.value && index > 0) {
            inputs[index - 1].focus();
        }
    });

    input.addEventListener("paste", (e) => {
        e.preventDefault();
        const digits = (e.clipboardData.getData("text") || "").replace(/[^0-9]/g, "").slice(0, inputs.length);
        digits.split("").forEach((d, i) => {
            if (inputs[i]) inputs[i].value = d;
        });
        hiddenOtp.value = collectOtp();
        const nextEmpty = Array.from(inputs).findIndex((i) => !i.value);
        (nextEmpty === -1 ? inputs[inputs.length - 1] : inputs[nextEmpty]).focus();
    });
});

function setSubmitLoading(loading) {
    if (loading) {
        submitBtn.classList.add("btn-disabled");
        submitLabel.innerHTML = '<span class="spinner"></span>Verifying...';
    } else {
        submitBtn.classList.remove("btn-disabled");
        submitLabel.innerHTML = 'ENTER WHEELVERSE <span class="material-symbols-outlined text-on-primary-container">speed</span>';
    }
}

// ------------------------------------------------------------------
// Submit OTP via AJAX. On a WRONG otp, the page does NOT reload and
// the countdown timer is left completely untouched — only the error
// message is shown and the boxes are cleared for retry.
// ------------------------------------------------------------------
otpForm.addEventListener("submit", async function (e) {
    e.preventDefault();
    otpError.innerText = "";
    generalMessage.classList.add("hidden");

    hiddenOtp.value = collectOtp();
    if (hiddenOtp.value.length !== 6) {
        otpError.innerText = "Please enter the complete 6-digit OTP.";
        shakeInputs();
        return;
    }

    setSubmitLoading(true);

    try {
        const response = await fetch(otpForm.action || window.location.href, {
            method: "POST",
            body: new URLSearchParams({
                otp: hiddenOtp.value,
                csrfmiddlewaretoken: getCookie("csrftoken"),
            }),
            headers: {
                "X-Requested-With": "XMLHttpRequest",
                "X-CSRFToken": getCookie("csrftoken"),
                "Content-Type": "application/x-www-form-urlencoded",
            },
        });

        const data = await response.json();

        if (response.ok && data.success) {
            showGeneral(data.message || "Verified! Redirecting...", false);
            window.location.href = data.redirect_url;
            return;
        }

        // Wrong / expired OTP — stay on page, timer untouched, just show the error.
        otpError.innerText = data.message || "Invalid security code. Please try again.";
        shakeInputs();
        clearOtpInputs();

        if (data.expired) {
            // Only an actual expiry (not a wrong guess) freezes the timer at 0.
            timeLeft = 0;
            renderTimer();
        }
    } catch (err) {
        showGeneral("Network error. Please check your connection and try again.", true);
    } finally {
        setSubmitLoading(false);
    }
});

// ------------------------------------------------------------------
// Timer: starts from the server-computed remaining time so a browser
// reload resumes the real countdown instead of resetting it. Nothing
// here ever calls resend automatically.
// ------------------------------------------------------------------
let timeLeft = {{ remaining_seconds }};
let timerHandle = null;

function renderTimer() {
    if (timeLeft <= 0) {
        otpTimer.innerText = "00:00";
        resendBtn.classList.remove("pointer-events-none", "opacity-50", "cursor-not-allowed");
        resendBtn.classList.add("cursor-pointer", "hover:underline");
        resendBtn.innerText = "Resend Verification Code";
        if (timerHandle) clearInterval(timerHandle);
        return;
    }
    const minutes = String(Math.floor(timeLeft / 60)).padStart(2, "0");
    const seconds = String(timeLeft % 60).padStart(2, "0");
    otpTimer.innerText = `${minutes}:${seconds}`;
    resendBtn.classList.add("pointer-events-none", "opacity-50", "cursor-not-allowed");
    resendBtn.classList.remove("cursor-pointer", "hover:underline");
    resendBtn.innerText = `Resend Code in (${timeLeft}s)`;
}

function startTimer() {
    renderTimer();
    if (timerHandle) clearInterval(timerHandle);
    timerHandle = setInterval(() => {
        if (timeLeft > 0) {
            timeLeft -= 1;
            renderTimer();
        } else {
            clearInterval(timerHandle);
        }
    }, 1000);
}

startTimer();

// ------------------------------------------------------------------
// Resend button: ONLY this action resends the OTP and resets the
// timer back to full. It's disabled the whole time timeLeft > 0, so
// it can only fire once the countdown has actually hit zero.
// ------------------------------------------------------------------
resendBtn.addEventListener("click", async function () {
    if (timeLeft > 0) return;

    resendBtn.classList.add("pointer-events-none", "opacity-50", "cursor-not-allowed");
    resendBtn.innerText = "Sending...";

    try {
        const response = await fetch("{% url 'resend_signup_otp' %}", {
            method: "POST",
            headers: {
                "X-Requested-With": "XMLHttpRequest",
                "X-CSRFToken": getCookie("csrftoken"),
            },
        });

        const data = await response.json();

        if (data.success) {
            clearOtpInputs();
            otpError.innerText = "";
            showGeneral(data.message || "A new OTP has been sent.", false);
            timeLeft = data.remaining_seconds;
            startTimer();
        } else {
            showGeneral(data.message || "Failed to resend OTP. Please try again.", true);
            renderTimer();
        }
    } catch (err) {
        showGeneral("Network error while resending OTP.", true);
        renderTimer();
    }
});
</script>
</body>
