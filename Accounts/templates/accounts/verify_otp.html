<main class="relative z-10 min-h-screen flex items-center justify-center pt-20 px-margin-mobile md:px-0">

<!-- Decorative Glow Behind -->

<span class="font-label-caps text-[10px] tracking-[0.3em] text-on-surface-variant uppercase">Enter the Universe of Wheels</span>
</div>

{% if messages %}
<div id="messageBox" class="w-full mb-5">
    {% for message in messages %}
        <div class="px-4 py-3 rounded-lg text-sm text-center border
            {% if message.tags == 'error' %}
                bg-red-500/20 text-red-400 border-red-500/30
            {% elif message.tags == 'success' %}
                bg-green-500/20 text-green-400 border-green-500/30
            {% endif %}
        ">
            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %}
<form method="POST" action="{% url 'verify_otp' %}" class="w-full">

    {% csrf_token %}

    <input type="hidden" name="otp" id="otp">

    <!-- OTP 6 Columns -->
    <div class="flex justify-center gap-3 mb-8">

        <input maxlength="1" type="text" class="otp-input w-14 h-16 bg-surface-container-high/60 border border-outline-variant/30 rounded-xl text-center text-2xl font-bold text-primary focus:outline-none transition-all duration-300">

        <input maxlength="1" type="text" class="otp-input w-14 h-16 bg-surface-container-high/60 border border-outline-variant/30 rounded-xl text-center text-2xl font-bold text-primary focus:outline-none transition-all duration-300">

        <input maxlength="1" type="text" class="otp-input w-14 h-16 bg-surface-container-high/60 border border-outline-variant/30 rounded-xl text-center text-2xl font-bold text-primary focus:outline-none transition-all duration-300">

        <input maxlength="1" type="text" class="otp-input w-14 h-16 bg-surface-container-high/60 border border-outline-variant/30 rounded-xl text-center text-2xl font-bold text-primary focus:outline-none transition-all duration-300">

        <input maxlength="1" type="text" class="otp-input w-14 h-16 bg-surface-container-high/60 border border-outline-variant/30 rounded-xl text-center text-2xl font-bold text-primary focus:outline-none transition-all duration-300">

        <input maxlength="1" type="text" class="otp-input w-14 h-16 bg-surface-container-high/60 border border-outline-variant/30 rounded-xl text-center text-2xl font-bold text-primary focus:outline-none transition-all duration-300">

    </div>

    <!-- Timer -->
    <div class="flex flex-col items-center gap-4 mb-10">

        <div class="flex items-center gap-2 font-label-caps text-primary/80 bg-primary/5 px-4 py-2 rounded-full border border-primary/20">
            <span class="material-symbols-outlined text-[16px]">timer</span>

            <span id="otpTimer" class="text-sm font-bold tracking-widest">
                01:00
            </span>
        </div>

       <div class="mt-6 text-center">
            <p class="text-xs text-on-surface-variant/60 font-body-md">
                <a href="{% url 'resend_otp' %}" class="text-primary hover:text-primary-container font-semibold transition-colors underline underline-offset-4 tracking-wider ml-1 uppercase text-[11px] font-label-caps">
                    Resend Code
                </a>
            </p>
        </div>

    </div>

    <!-- Submit Button -->
    <button
        type="submit"
        class="w-full bg-primary text-on-primary py-5 rounded-lg font-headline-md text-label-caps flex items-center justify-center gap-3 group transition-all active:scale-95 neon-underglow-gold"
    >
        Unlock WheelVerse

        <span class="material-symbols-outlined group-hover:translate-x-2 transition-transform">
            arrow_forward
        </span>
    </button>

</form>

<script>
const inputs = document.querySelectorAll(".otp-input");
const hiddenOtp = document.getElementById("otp");

inputs.forEach((input, index) => {

    input.addEventListener("input", () => {
        input.value = input.value.replace(/[^0-9]/g, "");

        if (input.value && index < inputs.length - 1) {
            inputs[index + 1].focus();
        }

        hiddenOtp.value = Array.from(inputs)
            .map(i => i.value)
            .join("");
    });

    input.addEventListener("keydown", (e) => {
        if (e.key === "Backspace" && !input.value && index > 0) {
            inputs[index - 1].focus();
        }
    });

});

let timeLeft = 60;

const timerText = document.getElementById("otpTimer");
const resendBtn = document.getElementById("resendBtn");

const countdown = setInterval(() => {
    let minutes = Math.floor(timeLeft / 60);
    let seconds = timeLeft % 60;

    timerText.innerText =
        `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;

    if (timeLeft <= 0) {
        clearInterval(countdown);
        timerText.innerText = "00:00";

        resendBtn.disabled = false;
        resendBtn.classList.remove("opacity-50", "cursor-not-allowed");
    }

    timeLeft--;
}, 1000);

setTimeout(function () {
    const messageBox = document.getElementById("messageBox");

    if (messageBox) {
        messageBox.style.transition = "all 0.5s ease";
        messageBox.style.opacity = "0";
        messageBox.style.transform = "translateY(-10px)";

        setTimeout(function () {
            messageBox.remove();
        }, 500);
    }
}, 3000);

</script>
