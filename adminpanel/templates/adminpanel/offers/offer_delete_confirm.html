{% extends "adminpanel/offers/offer_base.html" %}

{% block title %}Delete Offer | WheelVerse{% endblock %}

{% block content %}
<section class="max-w-2xl mx-auto pt-16">
    <div class="offer-card p-8 text-center">
        <span class="material-symbols-outlined text-6xl text-red-300">warning</span>

        <h1 class="font-orbitron text-2xl text-gold mt-5">Delete Offer?</h1>

        <p class="text-muted mt-4">
            “{{ offer.title }}” will be disabled and removed from the admin offer list.
        </p>

        <div class="flex flex-col sm:flex-row justify-center gap-4 mt-8">
            <a href="{% url 'admin_offers' %}"
               class="px-8 py-4 border border-white/10 font-orbitron text-xs uppercase tracking-widest">
                Cancel
            </a>

            <form method="post" action="{% url 'delete_offer' offer.id %}">
                {% csrf_token %}
                <button class="px-8 py-4 bg-red-500/15 border border-red-500/30 text-red-300 font-orbitron text-xs uppercase tracking-widest"
                        type="submit">
                    Delete Offer
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
