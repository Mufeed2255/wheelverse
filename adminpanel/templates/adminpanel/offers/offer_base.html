{% load static %}
<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WheelVerse Offers{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: "#f2ca50",
                        panel: "#171713",
                        muted: "#d0c5af"
                    },
                    fontFamily: {
                        orbitron: ["Orbitron", "sans-serif"],
                        poppins: ["Poppins", "sans-serif"]
                    }
                }
            }
        };
    </script>

    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background:
                radial-gradient(circle at 70% 10%, rgba(242,202,80,.08), transparent 28%),
                #090908;
            color: #eae1d4;
            font-family: Poppins, sans-serif;
        }
        .offer-card {
            background: linear-gradient(145deg, rgba(27,27,25,.96), rgba(14,14,13,.96));
            border: 1px solid rgba(242,202,80,.17);
            box-shadow: 0 20px 50px rgba(0,0,0,.38);
        }
        .field {
            width: 100%;
            min-height: 52px;
            background: #11110e !important;
            border: 0 !important;
            border-bottom: 1px solid rgba(242,202,80,.2) !important;
            color: #fff !important;
            border-radius: 0 !important;
        }
        .field:focus {
            border-bottom-color: #f2ca50 !important;
            box-shadow: 0 8px 18px -12px rgba(242,202,80,.8) !important;
            outline: none !important;
            --tw-ring-color: transparent !important;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(88%) sepia(69%) saturate(650%);
        }
        .gold-btn {
            background: linear-gradient(135deg, #ffe375, #f2ca50, #cda522);
            color: #231b03;
            box-shadow: 0 0 20px rgba(242,202,80,.18);
        }
        /* Table responsiveness utility */
        .table-container {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden relative">

{% include 'adminpanel/includes/admin_sidebar.html' %}
{% include 'adminpanel/includes/admin_topbar.html' %}
{% include 'adminpanel/includes/messages.html' %}

<!-- Main Content Wrapper adjusted for Mobile, Tablet, and Desktop -->
<main class="min-h-screen pt-[80px] sm:pt-[92px] lg:ml-[280px] px-4 sm:px-6 lg:px-8 pb-12 transition-all duration-300">
    <div class="max-w-[1500px] mx-auto w-full">
        {% block content %}{% endblock %}
    </div>
</main>

</body>
</html>
