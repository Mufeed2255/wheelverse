{% load static %}
<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>WHEELVERSE — ADD CATEGORY</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f2ca50",
                        "background": "#16130b",
                        "surface": "#16130b",
                        "surface-container": "#231f17",
                        "on-surface": "#eae1d4",
                        "on-surface-variant": "#d0c5af"
                    },
                    fontFamily: {
                        "headline-md": ["Orbitron"],
                        "label-caps": ["Orbitron"],
                        "body-md": ["Poppins"]
                    }
                },
            },
        }
    </script>
    <style>
        body {
            background-color: #0A0A0A;
            background-image: radial-gradient(circle at 2px 2px, rgba(242, 202, 80, 0.03) 1px, transparent 0);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="text-on-surface font-body-md h-screen overflow-hidden flex">

    {% include 'adminpanel/includes/admin_sidebar.html' %}

    <div class="flex-1 pl-[240px] pt-[70px] flex flex-col h-screen overflow-hidden">
        
        
        {% include 'adminpanel/includes/admin_topbar.html' %}

        <main class="flex-1 overflow-y-auto bg-[#0A0A0A] p-8 flex items-center justify-center">
            <div class="w-full max-w-[750px] bg-black/40 border border-primary/10 p-10 relative">
                
                {% include 'adminpanel/includes/messages.html' %}
                
                <form method="POST" action="{% url 'add_category' %}" class="space-y-8">
                    {% csrf_token %}
                    
                    <div class="border-b border-primary/20 pb-2 focus-within:border-primary transition-colors">
                        <label class="block text-[10px] font-label-caps text-primary tracking-widest uppercase mb-1">CATEGORY NAME</label>
                        <input type="text" name="category_name" required placeholder="e.g., Hyper Cars" class="w-full bg-transparent border-none p-0 text-xl font-headline-md font-light text-on-surface placeholder:text-on-surface-variant/20 focus:ring-0"/>
                    </div>

                    <div class="space-y-2">
                        <label class="block text-[10px] font-label-caps text-primary tracking-widest uppercase">DESCRIPTION</label>
                        <textarea name="description" rows="6" placeholder="Enter a brief overview of the category's narrative and composition..." class="w-full bg-[#16130b]/60 border border-primary/10 text-xs p-4 text-on-surface placeholder:text-on-surface-variant/20 focus:border-primary focus:ring-0 resize-none">{{ description|default:"" }}</textarea>
                    </div>

                    <div class="flex gap-4 pt-4">
                        <button type="submit" class="flex-1 py-3 bg-primary text-black primary font-label-caps text-xs font-bold uppercase tracking-widest hover:bg-primary/90 transition-all flex items-center justify-center gap-2">
                            <span class="material-symbols-outlined text-sm font-bold">bolt</span> ADD CATEGORY
                        </button>

                        
                        <a href="{% url 'admin_category' %}" class="px-8 py-3 border border-primary/20 text-on-surface-variant text-xs font-label-caps tracking-widest hover:bg-white/5 transition-all flex items-center justify-center">
                            CANCEL
                        </a>
                    </div>
                </form>

            </div>
        </main>
    </div>
</body>
</html>
