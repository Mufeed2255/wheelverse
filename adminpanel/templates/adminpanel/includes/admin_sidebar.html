{% with url_name=request.resolver_match.url_name %}
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

<!-- Mobile overlay (click to close sidebar) -->
<div class="wv-overlay" id="wvOverlay" onclick="wvCloseSidebar()"></div>

<aside class="wv-sidebar" id="wvSidebar">
    <div class="wv-logo">
        <div class="wv-logo-row">
            <h1>WHEEL<span>VERSE</span></h1>
            <button class="wv-close-btn" id="wvCloseBtn" onclick="wvCloseSidebar()">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <p>ADMIN Dashboard</p>
    </div>

    <!-- Scrollable Navigation Area -->
    <div class="wv-menu custom-scrollbar">
        <a href="{% url 'admin_dashboard' %}" class="wv-item {% if url_name == 'admin_dashboard' %}active{% endif %}">
            <span class="material-symbols-outlined">dashboard</span>Dashboard
        </a>

        <a href="{% url 'admin_products' %}" class="wv-item {% if url_name == 'admin_products' %}active{% endif %}">
            <span class="material-symbols-outlined">inventory_2</span>Products
        </a>

        <a href="{% url 'admin_category' %}" class="wv-item {% if url_name == 'admin_category' %}active{% endif %}">
            <span class="material-symbols-outlined">category</span>Category
        </a>

        <a href="{% url 'admin_orders' %}" class="wv-item {% if url_name == 'admin_orders' %}active{% endif %}">
            <span class="material-symbols-outlined">shopping_cart</span>Orders
        </a>

        <a href="{% url 'admin_returns' %}" class="wv-item {% if url_name == 'admin_returns' %}active{% endif %}">
            <span class="material-symbols-outlined">assignment_return</span>Returns
        </a>

        <a href="{% url 'admin_users' %}" class="wv-item {% if url_name == 'admin_users' or url_name == 'view_user' %}active{% endif %}">
            <span class="material-symbols-outlined">groups</span>Customers
        </a>

        <a href="{% url 'sales_report' %}" class="wv-item {% if url_name == 'sales_report' %}active{% endif %}">
            <span class="material-symbols-outlined">monitoring</span>Analytics
        </a>

        <a href="{% url 'admin_coupons' %}" class="wv-item {% if url_name == 'admin_coupons' %}active{% endif %}">
            <span class="material-symbols-outlined">sell</span>Coupons
        </a>

        <a href="{% url 'admin_offers' %}" class="wv-item {% if url_name == 'admin_offers' %}active{% endif %}">
            <span class="material-symbols-outlined">local_offer</span>Offers
        </a>
    </div>

    <div class="wv-logout">
        <a href="{% url 'admin_logout' %}">
            <span class="material-symbols-outlined">logout</span>
            <span>ADMIN LOGOUT</span>
        </a>
    </div>
</aside>

<style>
    .wv-sidebar {
        position: fixed;
        left: 0;
        top: 0;
        width: 240px;
        height: 100vh;
        height: 100dvh; /* Mobile browser height fix */
        background: #070707;
        border-right: 1px solid rgba(242,202,80,.08);
        display: flex;
        flex-direction: column;
        z-index: 200;
        font-family: 'Poppins', sans-serif;
        box-sizing: border-box;
        transition: transform .3s ease;
        overflow: hidden;
    }
    .wv-logo {
        padding: 25px 20px;
        border-bottom: 1px solid rgba(242,202,80,.08);
        flex-shrink: 0;
    }
    .wv-logo-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .wv-logo h1 {
        color: #ffffff;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 1px;
        margin: 0;
        font-family: 'Orbitron', sans-serif;
    }
    .wv-logo span {
        color: #d4af37;
    }
    .wv-logo p {
        color: #9b7d21;
        font-size: 11px;
        margin-top: 5px;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-family: 'Orbitron', sans-serif;
    }
    .wv-close-btn {
        display: none;
        background: none;
        border: none;
        color: #b8b8b8;
        cursor: pointer;
        padding: 4px;
        border-radius: 4px;
    }
    .wv-close-btn:hover {
        background: #1a1a1a;
        color: #fff;
    }
    .wv-menu {
        padding: 20px 10px;
        flex: 1;
        min-height: 0; /* Important fix for flex child scrolling */
        overflow-y: auto;
        -webkit-overflow-scrolling: touch; /* Smooth iOS scrolling */
        touch-action: pan-y; /* Enable smooth touch scrolling */
        display: flex;
        flex-direction: column;
    }
    .wv-item {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #b8b8b8;
        text-decoration: none;
        padding: 12px 18px;
        margin-bottom: 6px;
        border-radius: 4px;
        transition: .3s;
        font-size: 14px;
        flex-shrink: 0;
    }
    .wv-item:hover {
        background: #1a1a1a;
        color: #fff;
    }
    .wv-item.active {
        background: #d4af37;
        color: #111;
        font-weight: 600;
    }
    .wv-logout {
        padding: 15px;
        border-top: 1px solid rgba(242,202,80,.05);
        margin-top: auto;
        flex-shrink: 0;
    }
    .wv-logout a {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #2d2416;
        border: 1px solid rgba(212,175,55,.2);
        color: #f0c75e;
        text-decoration: none;
        padding: 12px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 1px;
        transition: all 0.3s ease;
    }
    .wv-logout a:hover {
        background: #93000a;
        border-color: #ffb4ab;
        color: #ffdad6;
    }
    .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
        background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(212, 175, 55, 0.3);
        border-radius: 4px;
    }
    .custom-scrollbar {
        -ms-overflow-style: auto;
        scrollbar-width: thin;
    }
    .material-symbols-outlined {
        font-size: 20px;
    }

    /* Overlay behind drawer on mobile */
    .wv-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.55);
        z-index: 150;
        opacity: 0;
        transition: opacity .3s ease;
    }
    .wv-overlay.active {
        display: block;
        opacity: 1;
    }

    /* ===== TABLET (icon-only rail) ===== */
    @media (max-width: 1050px) and (min-width: 769px) {
        .wv-sidebar { width: 76px; }
        .wv-logo p,
        .wv-logo h1,
        .wv-item span:last-child,
        .wv-logout a span:last-child {
            display: none;
        }
        .wv-logo { padding: 20px 0; text-align: center; }
        .wv-item {
            justify-content: center;
            padding: 14px 0;
        }
        .wv-logout a { padding: 10px; }
    }

    /* ===== MOBILE (off-canvas drawer) ===== */
    @media (max-width: 768px) {
        .wv-sidebar {
            width: 78%;
            max-width: 280px;
            transform: translateX(-100%);
            box-shadow: 4px 0 25px rgba(0,0,0,.5);
        }
        .wv-sidebar.wv-open {
            transform: translateX(0);
        }
        .wv-close-btn {
            display: block;
        }
        .wv-item {
            padding: 14px 18px;
            font-size: 15px;
        }
    }
</style>

<script>
    function wvOpenSidebar() {
        document.getElementById('wvSidebar').classList.add('wv-open');
        document.getElementById('wvOverlay').classList.add('active');
        document.body.style.overflow = 'hidden';
    }
    function wvCloseSidebar() {
        document.getElementById('wvSidebar').classList.remove('wv-open');
        document.getElementById('wvOverlay').classList.remove('active');
        document.body.style.overflow = '';
    }
    function wvToggleSidebar() {
        document.getElementById('wvSidebar').classList.contains('wv-open')
            ? wvCloseSidebar()
            : wvOpenSidebar();
    }
    // Auto-close drawer if window is resized back to desktop
    window.addEventListener('resize', function () {
        if (window.innerWidth > 768) wvCloseSidebar();
    });
</script>
{% endwith %}
