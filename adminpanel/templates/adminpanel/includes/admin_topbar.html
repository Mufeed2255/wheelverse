<style>
.admin-header {
    background: #111007;
    border-bottom: 1px solid #342b16;
    height: 70px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 24px 0 260px; /* Sidebar Width 240px + 20px Spacing */
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 50;
    box-sizing: border-box;
    transition: padding .3s ease;
}

.wv-hamburger {
    display: none;
    background: none;
    border: none;
    color: #f1c82c;
    cursor: pointer;
    padding: 6px;
    margin-right: 12px;
    border-radius: 4px;
}
.wv-hamburger:hover { background: #1a1a1a; }

.header-left {
    display: flex;
    align-items: center;
}

.header-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
    white-space: nowrap;
}

.header-title span {
    color: #f1c82c;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 20px;
}

.feed-status {
    background: rgba(50, 233, 109, 0.08);
    border: 1px solid rgba(50, 233, 109, 0.25);
    color: #32e96d;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    padding: 6px 14px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
    letter-spacing: 1px;
    white-space: nowrap;
}

.admin-profile-circle {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid #f1c82c;
    overflow: hidden;
    background: #211d16;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.admin-profile-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.admin-avatar-initials {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: #f1c82c;
    background: #211d16;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* ===== TABLET / DESKTOP RESPONSIVE BREAKPOINTS ===== */
@media (max-width: 1024px) {
    .admin-header {
        padding: 0 16px;
        height: 60px;
    }
    .wv-hamburger { 
        display: flex; 
        align-items: center;
        justify-content: center;
    }
    .header-title { font-size: 16px; }

    /* Collapse real-time badge on smaller screens */
    .feed-status span:last-child { display: none; }
    .feed-status .material-symbols-outlined { font-size: 0; }
    .feed-status {
        width: 12px;
        height: 12px;
        padding: 0;
        border-radius: 50%;
        border: none;
        background: #32e96d;
        box-shadow: 0 0 6px rgba(50,233,109,.6);
    }

    .header-right { gap: 12px; }
    .admin-profile-circle { width: 32px; height: 32px; }
}

@media (max-width: 380px) {
    .header-title { font-size: 13px; }
}
</style>

<header class="admin-header">
    <div class="header-left">
        <button class="wv-hamburger" onclick="wvToggleSidebar()">
            <span class="material-symbols-outlined">menu</span>
        </button>
        <div class="header-title">WHEELVERSE <span>ADMIN</span></div>
    </div>

    <div class="header-right">
        <div class="feed-status">
            <span class="material-symbols-outlined" style="font-size: 14px;">sensors</span>
            <span>REAL-TIME FEED ACTIVE</span>
        </div>

        <div class="admin-profile-circle">
            {% if request.user.profile_picture %}
                <img src="{{ request.user.profile_picture.url }}" alt="{{ request.user.username }}">
            {% elif request.user.profile_pic %}
                <img src="{{ request.user.profile_pic.url }}" alt="{{ request.user.username }}">
            {% else %}
                <div class="admin-avatar-initials">{{ request.user.username|slice:":2"|upper }}</div>
            {% endif %}
        </div>
    </div>
</header>
