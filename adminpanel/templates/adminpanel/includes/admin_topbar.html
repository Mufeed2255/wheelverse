<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap');

.user-topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 96px;
    background: #110f0a;
    border-bottom: 1px solid #3d321b;
    z-index: 1000;
    display: flex;
    align-items: center;
    padding: 0 80px;
}

.user-logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 48px;
    font-weight: 800;
    text-decoration: none;
    letter-spacing: -2px;
}

.user-logo .gold { color: #f2ca50; }
.user-logo .white { color: #fff; }

.user-nav {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 52px;
}

.user-nav a {
    font-family: 'Orbitron', sans-serif;
    color: #d0c5af;
    text-decoration: none;
    font-size: 18px;
    letter-spacing: 1px;
    transition: .25s;
}

.user-nav a:hover,
.user-nav a.active {
    color: #f2ca50;
}

.user-actions {
    margin-left: 70px;
    display: flex;
    align-items: center;
    gap: 28px;
}

.user-actions a {
    color: #d0c5af;
    text-decoration: none;
}

.user-actions .material-symbols-outlined {
    font-size: 40px;
}

@media(max-width: 900px) {
    .user-topbar {
        padding: 0 24px;
    }

    .user-logo {
        font-size: 34px;
    }

    .user-nav {
        display: none;
    }

    .user-actions {
        margin-left: auto;
    }
}
</style>

{% with url_name=request.resolver_match.url_name %}
<header class="user-topbar">
    <a href="{% url 'landing_page' %}" class="user-logo">
        <span class="gold">Wheel</span><span class="white">Verse</span>
    </a>

    <nav class="user-nav">
        <a href="{% url 'landing_page' %}" class="{% if url_name == 'landing_page' %}active{% endif %}">Home</a>
        <a href="{% url 'collections' %}" class="{% if url_name == 'collections' %}active{% endif %}">Collections</a>
        <a href="{% url 'cart' %}" class="{% if url_name == 'cart' %}active{% endif %}">Cart</a>
        <a href="{% url 'wishlist' %}" class="{% if url_name == 'wishlist' %}active{% endif %}">Wishlist</a>
    </nav>

    <div class="user-actions">
        <a href="{% url 'cart' %}">
            <span class="material-symbols-outlined">shopping_cart</span>
        </a>

        <a href="{% url 'profile_view' %}">
            <span class="material-symbols-outlined">account_circle</span>
        </a>
    </div>
</header>
{% endwith %}
