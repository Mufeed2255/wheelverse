{% load static %}
<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>WHEELVERSE — EDIT CATEGORY</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f2ca50", "background": "#16130b", "surface": "#16130b",
                        "surface-container": "#231f17", "on-surface": "#eae1d4", "on-surface-variant": "#d0c5af"
                    },
                    fontFamily: { "headline-md": ["Orbitron"], "label-caps": ["Orbitron"], "body-md": ["Poppins"] }
                },
            },
        }
    </script>
</head>
<body class="text-on-surface font-body-md h-screen overflow-hidden flex bg-[#0A0A0A]">

    {% include 'adminpanel/includes/admin_sidebar.html' %}

    <div class="flex-1 pl-[240px] pt-[70px] flex flex-col h-screen overflow-hidden">
        {% include 'adminpanel/includes/admin_topbar.html' %}

        <main class="flex-1 overflow-y-auto bg-[#0A0A0A] p-8 flex items-center justify-center">
            <div class="w-full max-w-[750px] bg-black/40 border border-primary/10 p-10 relative">
                
                <form method="POST" action="{% url 'edit_category' category.id %}" class="space-y-8">
                    {% csrf_token %}
                    
                    <div class="border-b border-primary/20 pb-2 focus-within:border-primary transition-colors">
                        <label class="block text-[10px] font-label-caps text-primary tracking-widest uppercase mb-1">CATEGORY NAME</label>
                        <input type="text" name="category_name" value="{{ category.name }}" required class="w-full bg-transparent border-none p-0 text-xl font-headline-md font-light text-on-surface focus:ring-0"/>
                    </div>

                    <div class="space-y-2">
                        <label class="block text-[10px] font-label-caps text-primary tracking-widest uppercase">DESCRIPTION</label>
                        <textarea name="description" rows="6" class="w-full bg-[#16130b]/60 border border-primary/10 text-xs p-4 text-on-surface focus:border-primary focus:ring-0 resize-none">{{ category.description }}</textarea>
                    </div>

                    <div class="flex gap-4 pt-4">
                        <button type="submit" class="flex-1 py-3 bg-primary text-on-primary font-label-caps text-xs font-bold uppercase tracking-widest hover:bg-primary/90 transition-all flex items-center justify-center gap-2">
                            <span>⚡</span> UPDATE CATEGORY
                        </button>
                        <a href="{% url 'admin_category' %}" class="px-8 py-3 border border-primary/20 text-on-surface-variant text-xs font-label-caps tracking-widest hover:bg-white/5 transition-all flex items-center justify-center">
                            CANCEL
                        </a>
                    </div>
                </form>

            </div>
        </main>
    </div>
</body>
</html>
