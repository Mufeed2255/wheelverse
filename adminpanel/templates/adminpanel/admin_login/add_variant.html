<!DOCTYPE html>
<html class="dark" lang="en">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>WheelVerse Admin - Add Variants</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = { darkMode: "class", theme: { extend: { colors: { "background": "#16130b", "surface-container-low": "#1f1b13", "primary": "#f2ca50", "outline-variant": "#4d4635" }, fontFamily: { "headline-md": ["Orbitron"], "label-caps": ["Orbitron"] } } } }
    </script>
    <style>
        .carbon-texture {
            background-image: linear-gradient(45deg, #111 25%, transparent 25%), linear-gradient(-45deg, #111 25%, transparent 25%);
            background-size: 4px 4px;
            background-color: #0a0a0a;
        }
        .glass-card {
            background: rgba(26, 26, 26, 0.8);
            border: 1px solid rgba(242, 202, 80, 0.15);
        }
        .upload-zone {
            transition: all 0.3s ease;
        }
        .upload-zone.dragover {
            border-color: rgba(242, 202, 80, 0.8);
            background: rgba(242, 202, 80, 0.05);
            transform: scale(1.01);
        }
        .preview-image {
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .remove-btn {
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .preview-wrapper:hover .remove-btn {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-background text-white font-body-md">

    {% include 'adminpanel/includes/admin_sidebar.html' %}
    {% include 'adminpanel/includes/admin_topbar.html' %}

    <main class="ml-64 mt-20 h-[calc(100vh-5rem)] carbon-texture p-8 overflow-y-auto">
        <div class="max-w-4xl mx-auto">
            <h2 class="font-headline-md text-2xl tracking-wider uppercase mb-8 text-on-background">ADD VARIANTS</h2>

            <form method="POST" enctype="multipart/form-data" class="glass-card p-8 rounded-xl space-y-6 shadow-2xl">
                {% csrf_token %}

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block font-label-caps text-xs tracking-widest text-primary mb-2">PRICE (INR)</label>
                        <input type="number" step="0.01" name="price" required placeholder="0.00"
                            class="w-full bg-black/40 border border-outline-variant/30 p-3 text-sm text-white focus:border-primary focus:ring-0"/>
                    </div>
                    <div>
                        <label class="block font-label-caps text-xs tracking-widest text-primary mb-2">TOTAL QUANTITY</label>
                        <input type="number" name="stock" required value="1"
                            class="w-full bg-black/40 border border-outline-variant/30 p-3 text-sm text-white focus:border-primary focus:ring-0"/>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block font-label-caps text-xs tracking-widest text-primary mb-2">SIZE / SPECIFICATION</label>
                        <input type="text" name="size" required placeholder="e.g. 20-inch"
                            class="w-full bg-black/40 border border-outline-variant/30 p-3 text-sm text-white focus:border-primary focus:ring-0"/>
                    </div>
                    <div>
                        <label class="block font-label-caps text-xs tracking-widest text-primary mb-2">PRODUCT COLOR</label>
                        <input type="text" name="color" required placeholder="e.g. Rosso Corsa Red"
                            class="w-full bg-black/40 border border-outline-variant/30 p-3 text-sm text-white focus:border-primary focus:ring-0"/>
                    </div>
                </div>

                <!-- IMAGE UPLOAD SECTION -->
                <div>
                    <label class="block font-label-caps text-xs tracking-widest text-primary mb-2">VISUAL DOCUMENTATION</label>

                    <!-- Drop Zone -->
                    <div id="uploadZone"
                        class="upload-zone border-2 border-dashed border-outline-variant/30 rounded-lg p-8 text-center bg-black/20 hover:border-primary/40 cursor-pointer relative">

                        <input type="file"
                            id="variantImageInput"
                            name="variant_images"
                            accept="image/*"
                            multiple>

                        <div class="mt-5">

                            <img id="cropImage"
                                class="hidden w-full max-h-[400px] object-contain">

                        </div>

                        <button type="button"
                                id="cropBtn"
                                class="hidden btn-gold">

                            Crop Image

                        </button>

                        <div id="uploadPrompt">
                            <span class="material-symbols-outlined text-5xl text-primary/30 block mb-3">cloud_upload</span>
                            <h4 class="font-headline-md text-sm text-primary mb-1">UPLOAD VARIANT IMAGE</h4>
                            <p class="text-[11px] text-gray-500 mb-3">Drag & drop or click to browse</p>
                            <p class="text-[10px] text-outline-variant font-label-caps tracking-widest">JPG, PNG, WEBP — MAX 5MB</p>
                        </div>
                    </div>

                    <!-- Image Preview (hidden by default) -->
                    <div id="previewContainer" class="hidden mt-4">
                        <p class="font-label-caps text-[10px] text-primary/60 tracking-widest mb-3">SELECTED IMAGE</p>
                        <div class="preview-wrapper relative inline-block">
                            <img id="previewImage"
                                 src="#"
                                 alt="Preview"
                                 class="preview-image w-48 h-32 object-cover rounded-lg border border-primary/20"/>

                            <!-- Image info overlay -->
                            <div class="absolute bottom-0 left-0 right-0 bg-black/70 px-2 py-1 rounded-b-lg">
                                <p id="fileName" class="text-[9px] font-label-caps text-primary/80 truncate"></p>
                                <p id="fileSize" class="text-[9px] text-gray-500"></p>
                            </div>

                            <!-- Remove button -->
                            <button type="button"
                                    id="removeImage"
                                    class="remove-btn absolute -top-2 -right-2 w-6 h-6 bg-red-500 rounded-full flex items-center justify-center hover:bg-red-600 transition-colors">
                                <span class="material-symbols-outlined text-xs text-white">close</span>
                            </button>
                        </div>

                        <!-- Change image button -->
                        <div class="mt-3">
                            <label for="variantImageInput"
                                   class="cursor-pointer inline-flex items-center gap-1 text-[10px] font-label-caps text-primary/60 hover:text-primary border border-primary/20 px-3 py-1.5 rounded hover:border-primary/40 transition-all">
                                <span class="material-symbols-outlined text-xs">swap_horiz</span>
                                CHANGE IMAGE
                            </label>
                        </div>
                    </div>

                    <!-- Error message -->
                    <p id="uploadError" class="hidden mt-2 text-[11px] text-red-400 font-label-caps tracking-wider"></p>
                </div>

                <div class="flex justify-end gap-4 pt-4">
                    <a href="{% url 'manage_variants' product.id %}"
                       class="px-6 py-3 border border-white/10 font-label-caps text-xs tracking-widest hover:bg-white/5">
                        CANCEL
                    </a>
                    <button type="submit"
                            class="px-6 py-3 bg-primary text-black font-label-caps text-xs font-bold tracking-widest hover:bg-primary/90 flex items-center gap-2 shadow-[0_0_15px_rgba(242,202,80,0.3)]">
                        <span class="material-symbols-outlined text-base">add</span> ADD VARIANT
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        const input = document.getElementById('variantImageInput');
        const uploadZone = document.getElementById('uploadZone');
        const uploadPrompt = document.getElementById('uploadPrompt');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const removeBtn = document.getElementById('removeImage');
        const uploadError = document.getElementById('uploadError');
        let cropper;

        const image=document.getElementById("cropImage");

        const cropBtn=document.getElementById("cropBtn");
        const MAX_SIZE_MB = 5;
        

        input.addEventListener("change",function(e){

            const file=e.target.files[0];

            if(!file) return;

            image.src=URL.createObjectURL(file);

            image.classList.remove("hidden");

            cropBtn.classList.remove("hidden");

            if(cropper){

                cropper.destroy();

            }

            cropper=new Cropper(image,{

                aspectRatio:1,

                viewMode:1,

                autoCropArea:1,

                responsive:true

            });

        });

        cropBtn.addEventListener("click",function(){

            const canvas=cropper.getCroppedCanvas({

                width:800,

                height:800

            });

            canvas.toBlob(function(blob){

                const file=new File(

                    [blob],

                    "cropped.jpg",

                    {

                        type:"image/jpeg"

                    }

                );

                const dt=new DataTransfer();

                dt.items.add(file);

                input.files=dt.files;

                alert("Image cropped successfully.");

            });

        });



        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function showPreview(file) {
            uploadError.classList.add('hidden');

            // Validate size
            if (file.size > MAX_SIZE_MB * 1024 * 1024) {
                uploadError.textContent = `File too large. Max size is ${MAX_SIZE_MB}MB.`;
                uploadError.classList.remove('hidden');
                input.value = '';
                return;
            }

            // Validate type
            if (!file.type.startsWith('image/')) {
                uploadError.textContent = 'Invalid file type. Please upload an image.';
                uploadError.classList.remove('hidden');
                input.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                previewImage.src = e.target.result;
                fileName.textContent = file.name;
                fileSize.textContent = formatSize(file.size);
                uploadPrompt.classList.add('hidden');
                previewContainer.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }

        function clearPreview() {
            input.value = '';
            previewImage.src = '#';
            previewContainer.classList.add('hidden');
            uploadPrompt.classList.remove('hidden');
            uploadError.classList.add('hidden');
        }

        // File input change
        input.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                showPreview(this.files[0]);
            }
        });

        // Remove button
        removeBtn.addEventListener('click', clearPreview);

        // Drag & drop
        uploadZone.addEventListener('dragover', function(e) {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', function() {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', function(e) {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) {
                // Assign to input so form submits it
                const dt = new DataTransfer();
                dt.items.add(file);
                input.files = dt.files;
                showPreview(file);
            }
        });
    </script>
</body>
</html>
