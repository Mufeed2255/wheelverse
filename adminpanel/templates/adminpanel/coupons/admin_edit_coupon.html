{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>WheelVerse Admin - Return Detail</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">


    <style>
        .label {
            display: block;
            color: #f2ca50;
            font-size: 12px;
            margin-bottom: 12px;
            font-family: Orbitron, sans-serif;
        }

        .input-box {
            width: 100%;
            background: #1d190f;
            border: 1px solid rgba(242, 202, 80, 0.12);
            color: #eae1d4;
            padding: 16px;
            outline: none;
            font-size: 15px;
        }

        .input-box:focus {
            border-color: rgba(242, 202, 80, 0.7);
            box-shadow: 0 0 18px rgba(242, 202, 80, 0.15);
        }
    </style>
</head>
<body>

{% include 'adminpanel/includes/admin_sidebar.html' %}
{% include 'adminpanel/includes/admin_topbar.html' %}
{% include 'adminpanel/includes/messages.html' %}

<main class="min-h-screen bg-[#050505] text-[#eae1d4] pl-[300px] pt-28 pr-10 pb-12">

    <h1 class="text-4xl font-bold uppercase tracking-widest mb-6 font-[Orbitron]">
        Edit Coupon
    </h1>

    <form method="POST" class="border border-[#f2ca50]/20 bg-gradient-to-br from-[#151515] to-[#050505] p-10 rounded shadow-2xl">
        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-8">

            <div>
                <label class="label">Coupon Name:</label>
                <input type="text" name="name" value="{{ coupon.name }}" required class="input-box">
            </div>

            <div>
                <label class="label">Valid From:</label>
                <input type="date" name="valid_from" value="{{ coupon.valid_from|date:'Y-m-d' }}" class="input-box">
            </div>

            <div>
                <label class="label">Coupon Code:</label>
                <input type="text" name="code" value="{{ coupon.code }}" required class="input-box uppercase">
            </div>

            <div>
                <label class="label">Min Cart Amount:</label>
                <input type="number" step="0.01" name="min_cart_amount" value="{{ coupon.min_cart_amount }}" class="input-box">
            </div>

            <div>
                <label class="label">Discount Type:</label>
                <select name="discount_type" class="input-box">
                    <option value="PERCENTAGE" {% if coupon.discount_type == "PERCENTAGE" %}selected{% endif %}>Percentage (%)</option>
                    <option value="FIXED" {% if coupon.discount_type == "FIXED" %}selected{% endif %}>Fixed Amount</option>
                </select>
            </div>

            <div>
                <label class="label">User Limit:</label>
                <input type="number" name="usage_limit" value="{{ coupon.usage_limit }}" class="input-box">
            </div>

            <div>
                <label class="label">Discount Value:</label>
                <input type="number" step="0.01" name="discount_value" value="{{ coupon.discount_value }}" required class="input-box">
            </div>

            <div>
                <label class="label">Valid Till:</label>
                <input type="date" name="valid_till" value="{{ coupon.valid_till|date:'Y-m-d' }}" required class="input-box">
            </div>

            <div>
                <label class="label">Max Discount Amount:</label>
                <input type="number" step="0.01" name="max_discount_amount" value="{{ coupon.max_discount_amount }}" class="input-box">
            </div>

            <div>
                <label class="label">Status:</label>

                <div class="flex items-center gap-4 mt-4">
                    <span class="text-xs text-[#8f8776]">Block</span>

                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" name="is_active" {% if coupon.is_active %}checked{% endif %} class="sr-only peer">
                        <div class="w-14 h-7 bg-[#2d2a21] rounded-full peer peer-checked:bg-[#ffb000] after:content-[''] after:absolute after:top-1 after:left-1 after:bg-[#d0c5af] after:w-5 after:h-5 after:rounded-full after:transition-all peer-checked:after:translate-x-7"></div>
                    </label>

                    <span class="text-xs text-[#8f8776]">Unblock</span>
                </div>
            </div>
        </div>

        <div class="border-t border-white/10 mt-16 pt-8 flex justify-end gap-6">
            <a href="{% url 'admin_coupons' %}" class="px-10 py-4 border border-white/10 font-[Orbitron] tracking-widest">
                Cancel
            </a>

            <button type="submit" class="px-12 py-4 bg-[#f2ca50] text-black font-[Orbitron] font-bold tracking-widest">
                Update Coupon
            </button>
        </div>
    </form>
</body>
</main>
