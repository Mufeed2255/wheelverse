<style>
.wv-topbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:80px;
    background:rgba(22,19,11,.9);
    backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(242,202,80,.15);
    z-index:1000;
}

.wv-topbar-container{
    max-width:1440px;
    height:100%;
    margin:auto;
    padding:0 60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

}

.wv-nav{

}

.wv-nav a{

    color:#d0c5af;
    text-decoration:none;
    transition:.3s;
}

.wv-nav a:hover{
    color:#f2ca50;
}

.wv-icons{
    display:flex;
    align-items:center;
    gap:18px;
}

.wv-icons a{
    color:#d0c5af;
    transition:.3s;
}

.wv-icons a:hover{

}
