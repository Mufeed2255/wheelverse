<style>
        .wv-topbar{
        position:fixed;
        top:0;
        left:18rem;
        right:0;
        height:80px;
        z-index:9999;
        background:rgba(17,15,10,.96);
        backdrop-filter:blur(18px);
        border-bottom:1px solid rgba(242,202,80,.12);
    }

    .wv-topbar-inner{
        height:100%;
        padding:0 48px;
        display:flex;
        align-items:center;
        justify-content:space-between;
    }

    /* ---------- Logo ---------- */

    .wv-topbar-logo{
        display:flex;
        align-items:center;
        text-decoration:none;
        white-space:nowrap;

        font-family:'Orbitron',sans-serif;
        font-size:42px;
        font-weight:800;
        letter-spacing:-0.04em;
        line-height:1;
    }

    .wv-logo-wheel{
        color:#f2ca50;
    }

    .wv-logo-verse{
        color:#ffffff;
    }

    /* ---------- Navigation ---------- */

    .wv-topbar-nav{
        display:flex;
        align-items:center;
        gap:42px;
    }

    .wv-topbar-nav a{
        font-family:'Orbitron',sans-serif;
        font-size:13px;
        font-weight:500;
        letter-spacing:.12em;
        color:#d0c5af;
        text-decoration:none;
        transition:.25s;
    }

    .wv-topbar-nav a:hover{
        color:#f2ca50;
    }

    /* Active page */

    .wv-topbar-nav a.active{
        color:#f2ca50;
        position:relative;
    }

    .wv-topbar-nav a.active::after{
        content:"";
        position:absolute;
        left:0;
        bottom:-14px;
        width:100%;
        height:2px;
        background:#f2ca50;
    }

    /* ---------- Right Icons ---------- */

    .wv-topbar-right{
        display:flex;
        align-items:center;
        gap:24px;
    }

    .wv-topbar-icon{
        position:relative;
        display:flex;
        align-items:center;
        justify-content:center;
        color:#d0c5af;
        transition:.25s;
    }

    .wv-topbar-icon .material-symbols-outlined{
        font-size:32px;
    }

    .wv-topbar-icon:hover{
        color:#f2ca50;
    }

    .wv-cart-count{
        position:absolute;
        top:-8px;
        right:-8px;
        width:22px;
        height:22px;
        border-radius:50%;
        background:#f2ca50;
        color:#000;
        font-family:'Orbitron',sans-serif;
        font-size:10px;
        font-weight:700;
        display:flex;
        align-items:center;
        justify-content:center;
    }

    @media(max-width:1024px){

        .wv-topbar{
            left:0;
        }

        .wv-topbar-inner{
            padding:0 20px;
        }

        .wv-topbar-logo{
            font-size:34px;
        }

        .wv-topbar-nav{
            display:none;
        }
    }
</style>
<header class="fixed top-0 left-0 right-0 z-50 h-24 bg-[#110f0a] border-b border-[#3d321b]">
    <div class="h-full flex items-center justify-between px-20">

        <a href="{% url 'landing_page' %}" class="font-orbitron text-5xl font-bold tracking-tight">
            <span class="text-[#f2ca50]">Wheel</span><span class="text-white">Verse</span>
        </a>

        <nav class="hidden lg:flex items-center gap-14 font-orbitron text-lg text-[#d0c5af]">
            <a href="{% url 'landing_page' %}" class="hover:text-[#f2ca50] transition">Home</a>
            <a href="{% url 'collections' %}" class="hover:text-[#f2ca50] transition">Collections</a>
            <a href="{% url 'cart' %}" class="hover:text-[#f2ca50] transition">Cart</a>
            <a href="{% url 'wishlist' %}" class="hover:text-[#f2ca50] transition">Wishlist</a>
        </nav>

        <div class="flex items-center gap-8">
            <a href="{% url 'cart' %}">
                <span class="material-symbols-outlined text-[#d0c5af] text-4xl hover:text-[#f2ca50] transition">
                    shopping_cart
                </span>
            </a>

            <a href="{% url 'profile_view' %}">
                <span class="material-symbols-outlined text-[#d0c5af] text-4xl hover:text-[#f2ca50] transition">
                    account_circle
                </span>
            </a>
        </div>

    </div>
</header>
